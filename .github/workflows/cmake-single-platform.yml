name: CMake build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: CUDA build
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA 13.4 compiler
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-13-4 cuda-cudart-dev-13-4 cccl-13-4
          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-15

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
