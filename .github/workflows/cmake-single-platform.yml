name: CMake build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # GitHub-hosted runners have no GPU: this only checks that the CUDA code
    # compiles for Hopper. Run tests locally with make test.
    name: CUDA build (sm_90a)
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA 13.4 compiler
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-13-4 cuda-cudart-dev-13-4
          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"

      - name: Build
        run: make build BATS_ARCH=90a
